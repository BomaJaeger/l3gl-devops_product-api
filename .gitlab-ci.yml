stages:
  - test
  - build
  - docker

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"

cache:
  paths:
    - .m2/repository

test:
  stage: test
  image: maven:3.9.6-eclipse-temurin-17
  script:
    - git clone https://github.com/BomaJaeger/l3gl-devops_product-core.git
    - cd l3gl-devops_product-core && mvn clean install -DskipTests -Dmaven.repo.local=../.m2/repository && cd ..
    - mvn test -Dmaven.repo.local=.m2/repository

build:
  stage: build
  image: maven:3.9.6-eclipse-temurin-17
  script:
    - git clone https://github.com/BomaJaeger/l3gl-devops_product-core.git
    - cd l3gl-devops_product-core && mvn clean install -DskipTests -Dmaven.repo.local=../.m2/repository && cd ..
    - mvn clean package -DskipTests -Dmaven.repo.local=.m2/repository
  artifacts:
    paths:
      - target/*.jar

docker:
  stage: docker
  image: docker:24
  services:
    - docker:24-dind
  script:
    - docker login -u $DOCKER_USERNAME -p $DOCKER_PASSWORD
    - docker build -t $DOCKER_IMAGE .
    - docker push $DOCKER_IMAGE
  only:
    - develop